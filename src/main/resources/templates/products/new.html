<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ürün Ekle</title>
    <link rel="stylesheet" th:href="@{/css/company/company.css}">
</head>
<body>

<div class="page-container">
    <section class="form-card">

        <div class="form-header">
            <h1>Ürün Ekle</h1>
            <p>Yeni ürün bilgilerini girerek kaydedebilirsiniz.</p>
        </div>

        <div class="error-message" th:if="${error}" th:text="${error}"></div>

        <form method="post"
              th:action="@{/companyOwner/products/new}"
              th:object="${productForm}"
              class="product-form">

            <div class="form-group">
                <label for="name">Ürün Adı</label>
                <input id="name" type="text" th:field="*{name}" placeholder="Örn: Laptop" required>
            </div>

            <div class="form-group">
                <label for="price">Ürün Fiyatı</label>
                <input id="price" type="number" th:field="*{price}" placeholder="Örn: 15000" min="0" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="code">Ürün Kodu</label>
                <input id="code" type="text" th:field="*{code}" placeholder="Örn: PRD-001" required>
            </div>

            <div class="form-group">
                <label for="stock">Stok</label>
                <input id="stock" type="number" th:field="*{stock}" placeholder="Örn: 25" min="0" required>
            </div>

            <div class="form-actions">
                <a class="secondary-btn" th:href="@{/companyOwner/products}">Geri Dön</a>
                <button type="submit" class="primary-btn">Ürünü Kaydet</button>
            </div>

        </form>
    </section>
</div>

<script defer src="/js/main.js" th:src="@{/js/main.js}"></script>
</body>
</html>
