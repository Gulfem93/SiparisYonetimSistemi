<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ürünlerimiz</title>
    <link rel="stylesheet" th:href="@{/css/company/company.css}">
</head>
<body>

<div class="dashboard">

    <aside class="sidebar">
        <div>
            <h2>Şirket Paneli</h2>
            <p class="sidebar-username" th:if="${displayName != null}" th:text="${displayName}">Şirket Adı</p>

            <nav class="menu">
                <a th:href="@{/companyOwner}">Ana Sayfa</a>
                <a th:href="@{/companyOwner/products}">Ürünlerimiz</a>
                <a href="#">Ayarlar</a>
            </nav>
        </div>

        <form method="post" th:action="@{/logout}" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="logout-btn">Çıkış Yap</button>
        </form>
    </aside>

    <main class="content">

        <section class="welcome-card">
            <h1>Ürünlerimiz</h1>
            <p>Kayıtlı ürünlerinizi buradan görüntüleyebilirsiniz.</p>
        </section>

        <section class="table-card">

            <div class="table-header">
                <h2>Ürün Listesi</h2>

                <div class="table-actions">
                    <a class="primary-btn small-btn"
                       th:href="@{/companyOwner/products/new}">
                        + Yeni Ürün
                    </a>
                </div>
            </div>

            <table class="product-table">
                <thead>
                <tr>
                    <th>Ürün Adı</th>
                    <th>Ürün Kodu</th>
                    <th>Fiyat</th>
                    <th>Stok</th>
                    <th>İşlem</th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="5" style="text-align:center;">
                        Henüz ürün eklenmemiş.
                    </td>
                </tr>

                <tr th:each="product : ${products}">
                    <td th:text="${product.name}">Laptop</td>
                    <td th:text="${product.code}">PRD-001</td>
                    <td th:text="${product.price}">15000</td>
                    <td th:text="${product.stock}">25</td>

                    <td class="action-buttons">
                        <a class="secondary-btn small-btn"
                           th:href="@{/companyOwner/products/edit/{code}(code=${product.code})}">
                            Düzenle
                        </a>

                        <a class="danger-btn small-btn delete-btn"
                           th:href="@{/companyOwner/products/delete/{code}(code=${product.code})}">
                            Sil
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

        </section>

    </main>

</div>

<script defer src="/js/main.js" th:src="@{/js/main.js}"></script>
</body>
</html>
